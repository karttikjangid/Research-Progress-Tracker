# Render Blueprint for Sentinel — a single free Docker web service.
# No persistent disk is needed: Litestream restores the SQLite DB from Supabase
# on boot and replicates changes back, so an ephemeral free instance is fine.
#
# You can also create this by hand (New + → Web Service → pick this repo →
# Runtime: Docker → Instance type: Free) and set the same env vars in the
# dashboard — that path is the most reliable for the free tier.
services:
  - type: web
    name: sentinel
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GATEKEEPER_STATE
        value: /data
      - key: SUPABASE_S3_BUCKET
        value: Sentinel
      - key: SUPABASE_S3_REGION
        value: ap-southeast-1
      - key: EVAL_MODEL
        value: meta/llama-3.1-70b-instruct
      # secrets — set these in the dashboard (never committed)
      - key: GATEKEEPER_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
